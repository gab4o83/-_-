    <script>
      // Single-Page-App fallback redirect for GitHub Pages without build step
      (function() {
        if (
          window.location.hostname.includes('github.io') &&
          !window.location.pathname.includes('/docs') &&
          document.querySelector('script[src*="main.tsx"]')
        ) {
          var base = window.location.pathname;
          if (!base.endsWith('/')) base += '/';
          window.location.replace(window.location.origin + base + 'docs/' + window.location.search + window.location.hash);
        }
      })();
